name: Build and Release Thunderbird APK

on:
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Must have write permission to create a Release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app-thunderbird:assembleDebug

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "tb-debug-${{ github.run_id }}" # Use run ID as tag to avoid conflicts
          name: "Thunderbird Debug APK (${{ github.run_number }})"
          files: "**/*.apk" # Match all APKs (as long as the build succeeds, it will find it)
          draft: false
          prerelease: true # Mark as pre-release (optional)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub, no need to configure manually
